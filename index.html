<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Contenido no disponible</title>
<style>
  :root{
    --primary:#1a237e;--primary-dark:#0d1642;
    --white:#fff;--gray-600:#868e96;--gray-800:#343a40;
    --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--font);min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:var(--white);text-align:center;padding:2rem}
  .box{max-width:520px}
  .box .icon{font-size:3rem;margin-bottom:1rem}
  .box h1{font-size:1.6rem;font-weight:700;margin-bottom:.6rem;letter-spacing:-.5px}
  .box p{font-size:1rem;opacity:.9;line-height:1.6}
</style>
</head>
<body>
  <div class="box">
    <div class="icon">🔒</div>
    <h1>Contenido no disponible</h1>
    <p>Esta página ya no se encuentra publicada en esta dirección. Si necesitas acceder al reporte, solicita el enlace vigente al responsable del canal.</p>
  </div>
</body>
</html>
